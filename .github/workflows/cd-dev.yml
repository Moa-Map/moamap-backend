name: CD (dev)

on:
  push:
    branches: [develop]

# contents: write — 매니페스트 태그 갱신 커밋
# id-token: write — AWS OIDC 페더레이션 (저장된 액세스 키 없이 IAM Role을 맡는다)
permissions:
  contents: write
  id-token: write

concurrency:
  group: cd-dev-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 189923011357.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  build-push:
    name: build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway-service, user-service, map-service, place-service]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::189923011357:role/moamap-ci-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # 노드가 Graviton(arm64)이라 arm64 이미지가 아니면 파드가 exec format error로 죽는다.
      # runner는 amd64라 QEMU 에뮬레이션이 필요하다 — 그래서 setup-qemu가 먼저 온다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ env.ECR_REGISTRY }}/moamap/${{ matrix.service }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-manifest:
    name: update dev overlay image tags
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Bump newTag
        run: |
          for svc in gateway-service user-service map-service place-service; do
            yq -i "(.images[] | select(.name == \"${{ env.ECR_REGISTRY }}/moamap/${svc}\")).newTag = \"${{ github.sha }}\"" k8s/overlays/dev/kustomization.yaml
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && echo "변경 없음, 커밋 스킵" && exit 0
          # [skip ci] — 이 커밋이 develop에 push되어도 워크플로우가 자기 자신을 다시 트리거하지 않게 함
          git commit -m "chore: dev 이미지 태그 갱신 (${{ github.sha }}) [skip ci]"
          git push
