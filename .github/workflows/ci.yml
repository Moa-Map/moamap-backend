name: CI

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop, main ]

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소해 러너를 아낀다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 빌드/테스트만 하므로 읽기 권한이면 충분.
permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # CI는 push를 하지 않으므로 토큰을 .git/config에 남기지 않는다(빌드 스크립트의 토큰 탈취 방지).
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build & Test
        run: ./gradlew build --no-daemon
