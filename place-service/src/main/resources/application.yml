server:
  port: 8082

spring:
  application:
    name: place-service
  datasource:
    # 기본값은 로컬 개발용. 비밀정보는 커밋 금지 — 실제 값은 환경변수로 주입한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moamap}
    username: ${DB_USERNAME:moamap}
    password: ${DB_PASSWORD:moamap}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        default_schema: place_service
  http:
    client:
      # 외부 HTTP 호출(map-service, 카카오 등) 타임아웃 — 장애 시 요청 스레드가 오래 묶이지 않도록.
      connect-timeout: 2s
      read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

services:
  map:
    # 지도 유형/멤버 역할 조회용 map-service 내부 호출 주소.
    base-url: ${MAP_SERVICE_URL:http://localhost:8083}
