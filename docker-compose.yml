# 로컬 개발용 PostgreSQL. `docker compose up -d`로 기동.
# container_name은 지정하지 않는다 — 워크트리를 여러 개 쓰면 이름이 충돌한다.
# DB는 하나(moamap), 서비스별로 스키마를 나눠 쓴다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moamap
      POSTGRES_USER: moamap
      POSTGRES_PASSWORD: moamap
    ports:
      - "5432:5432"
    volumes:
      - moamap-pgdata:/var/lib/postgresql/data
      # init 스크립트는 데이터 디렉터리가 비어 있는 최초 기동에만 실행된다.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  # 리프레시 토큰 저장용 Redis. TTL로 만료 토큰을 자동 삭제한다.
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # place-service ↔ map-service 이벤트 브로커 (place count 동기화 등에 사용).
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: moamap
      RABBITMQ_DEFAULT_PASS: moamap
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - moamap-rabbitmq-data:/var/lib/rabbitmq

# Prometheus/Grafana는 부하 측정 전용이라 여기 두지 않는다 — 평소 개발에는 필요 없는 컨테이너다.
# 필요할 때만 오버레이로 얹는다: docker compose -f docker-compose.yml -f load-test/compose.loadtest.yml up -d

volumes:
  moamap-pgdata:
  moamap-rabbitmq-data:
