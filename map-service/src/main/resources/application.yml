server:
  port: 8083

spring:
  application:
    name: map-service
  datasource:
    # 기본값은 로컬 개발용. 비밀정보는 커밋 금지 — 실제 값은 환경변수로 주입한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moamap}
    username: ${DB_USERNAME:moamap}
    password: ${DB_PASSWORD:moamap}
  jpa:
    hibernate:
      # ponytail: dev 편의용 update. 스키마 안정화되면 Flyway 마이그레이션으로 이관.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    # sql.init(seed data)가 Hibernate의 테이블 생성 이후에 돌게 순서를 미룬다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_schema: map_service
  sql:
    init:
      # postgres 같은 외부 DB는 기본적으로 자동 실행 안 됨 — 켜준다.
      mode: always
      data-locations: classpath:db/init.sql

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

seoul:
  api:
    # 서울 열린데이터광장. KEY는 절대 커밋 금지 — 환경변수로 주입.
    base-url: ${SEOUL_API_BASE_URL:http://openapi.seoul.go.kr:8088}
    key: ${SEOUL_API_KEY:}
    service: citydata_ppltn

map:
  congestion:
    # 서울시 citydata_ppltn 데이터 갱신 주기(5분)에 맞춤
    sync-interval-ms: ${CONGESTION_SYNC_INTERVAL_MS:300000}
  recommendation:
    # 홈 화면 추천 지도. 값을 바꿔가며 추천 결과를 조정할 수 있게 코드 밖으로 뺐다.
    default-size: 5
    max-size: 20
    # 점수를 매길 후보 상한. 지도가 늘어도 계산량이 이 선에서 유지된다.
    candidate-limit: 300
    weights:
      # 합이 1이 되도록 유지한다. 관심 프로필이 비면 아래 cold-start 값을 대신 쓴다.
      tag: 0.55
      popularity: 0.25
      freshness: 0.20
      # 참여 이력이 없을 때(콜드스타트) 쓰는 가중치. tag는 항상 0이라 나머지 둘의 합이 1이다.
      # "지금 많이 찾는 지도예요" 문구에 맞게 인기도가 결과를 주도하고, 신선도는 오래된 지도를 밀어내는 역할만 한다.
      cold-start:
        popularity: 0.80
        freshness: 0.20
    diversity:
      # 결과가 한 사람의 지도나 한 주제로 쏠리지 않게 하는 보정값
      max-per-owner: 1
      tag-overlap-penalty: 0.15
    profile:
      # 직접 만들거나 운영하는 지도에 주는 가중
      manager-role-weight: 1.5
      # 초대로 들어간 프라이빗 지도는 "내가 고른 컨셉"이 아니므로 신호를 약하게 본다
      invited-member-weight: 0.4
      # 참여 시점이 오래될수록 영향력이 줄어드는 기준(일)
      recency-half-life-days: 60
      # 지도 생성일이 오래될수록 신선도가 낮아지는 기준(일)
      freshness-half-life-days: 90
