server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    # 기본값은 로컬 개발용. 비밀정보는 커밋 금지 — 실제 값은 환경변수로 주입한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moamap}
    username: ${DB_USERNAME:moamap}
    password: ${DB_PASSWORD:moamap}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        default_schema: user_service

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

jwt:
  # dev 기본 시크릿. 운영은 반드시 환경변수로 교체.
  secret: ${JWT_SECRET:moamap-local-dev-jwt-secret-change-me-32bytes+}
  access-token-expiration-minutes: ${JWT_ACCESS_EXP_MIN:30}
  refresh-token-expiration-days: ${JWT_REFRESH_EXP_DAYS:14}

kakao:
  # 우리 카카오 앱 ID(토큰 검증용). 실제 값은 환경변수로 주입.
  app-id: ${KAKAO_APP_ID:0}
  token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
  user-info-uri: https://kapi.kakao.com/v2/user/me
