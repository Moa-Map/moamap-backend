server:
  port: 8080

spring:
  application:
    name: gateway-service

services:
  user-url: ${USER_SERVICE_URL:http://localhost:8081}
  map-url: ${MAP_SERVICE_URL:http://localhost:8083}
  place-url: ${PLACE_SERVICE_URL:http://localhost:8082}

jwt:
  # 시크릿은 커밋하지 않는다. 운영은 JWT_SECRET 환경변수, 로컬은 application-local.yml(또는 .env)로 주입한다.
  # 기본값을 두지 않아 미설정 시 앱이 기동되지 않게(fail-fast) 해, 알려진 값이 실수로 쓰이는 걸 막는다.
  # user-service와 반드시 동일한 값이어야 토큰이 검증된다.
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
