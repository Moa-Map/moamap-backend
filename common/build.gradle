plugins {
	id 'java-library'
}

// common은 실행 가능한 애플리케이션이 아닌 공유 라이브러리 모듈입니다.
dependencies {
	// 여러 서비스가 공유하는 공통 코드(공통 응답/예외/DTO 등)의 기반 의존성.
	api 'org.springframework.boot:spring-boot-starter-validation'
	// ApiResponse의 @JsonInclude 사용을 위한 컴파일 전용 의존성 (실제 jackson-databind는 각 서비스의 starter-web이 제공)
	compileOnly 'com.fasterxml.jackson.core:jackson-databind'

	// presigned URL 발급 유틸(ObjectStoragePresigner)이 쓰는 SDK. NHN Cloud Object Storage는 S3 호환 API라 그대로 재사용한다.
	// implementation 스코프로 둬야 user/map/notification-service의 컴파일 클래스패스로 전파되지 않는다(청사진 6장 1번 근거).
	implementation platform('software.amazon.awssdk:bom:2.49.0')
	implementation 'software.amazon.awssdk:s3'
}
