# DB는 Pod마다 전용 볼륨을 가져야 하므로 Deployment가 아닌 StatefulSet으로 배포한다.
# volumeClaimTemplates가 Pod별 PVC를 만들어, Pod가 재생성돼도 같은 볼륨에 다시 붙는다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: moamap
spec:
  # 다른 서비스가 postgres:5432 DNS로 접근하므로 기존 ClusterIP Service 이름을 그대로 쓴다.
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        # postgres:16 이미지의 postgres 계정 UID.
        runAsUser: 999
        # PVC로 붙은 볼륨은 기본이 root 소유라 non-root 프로세스가 쓰지 못한다.
        # fsGroup을 주면 마운트 시 볼륨 소유 그룹이 바뀌어 postgres가 쓸 수 있다.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16
          # postgres는 /tmp, /var/run/postgresql 등에 써야 해서 readOnlyRootFilesystem은 켜지 않는다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: moamap
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: moamap-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moamap-secrets
                  key: DB_PASSWORD
            # 볼륨 루트에 생기는 lost+found 때문에 initdb가 "directory not empty"로 실패한다.
            # 데이터는 하위 디렉터리에 두어 초기화가 정상 동작하게 한다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          # DB가 연결을 받을 준비가 됐는지 확인. 앱보다 먼저 떠야 하므로 readiness를 짧게 잡는다.
          # probe의 exec에는 $(VAR) 치환이 적용되지 않아, 셸을 거쳐 환경변수를 펼친다.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  # Pod별 PVC를 자동 생성한다(data-postgres-0). StatefulSet을 지워도 PVC는 남는다 —
  # 실수로 데이터가 사라지지 않게 하려는 쿠버네티스의 안전장치이며, 정리는 cluster/README.md 참고.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # 블록스토리지는 한 번에 한 노드만 마운트할 수 있다.
        accessModes: ["ReadWriteOnce"]
        storageClassName: cinder-block
        resources:
          requests:
            storage: 10Gi
