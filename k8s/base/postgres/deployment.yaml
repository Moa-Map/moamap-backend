apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: moamap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: moamap
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: moamap-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moamap-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      # 임시 개발/테스트용 — PVC 없이 emptyDir. Pod 재시작 시 데이터 유실됨.
      volumes:
        - name: data
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
