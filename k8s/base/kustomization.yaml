apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: postgres-init-scripts
    # docker/postgres/init/01-schemas.sql과 동일 내용 유지 (로컬 docker-compose와 동일한 스키마 초기화).
    files:
      - postgres/01-schemas.sql

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - gateway-service/deployment.yaml
  - gateway-service/service.yaml
  - user-service/deployment.yaml
  - user-service/service.yaml
  - map-service/deployment.yaml
  - map-service/service.yaml
  - place-service/deployment.yaml
  - place-service/service.yaml
# Secret은 값이 민감하므로 여기 포함하지 않고 별도로 apply 한다 (secrets/ 참고).
