apiVersion: apps/v1
kind: Deployment
metadata:
  name: place-service
  namespace: moamap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: place-service
  template:
    metadata:
      labels:
        app: place-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # k3s는 EKS와 달리 kubelet에 ECR credential provider가 없다. 노드에 IAM 인스턴스
      # 프로파일이 붙어 있어도 containerd가 ECR 인증을 못 하므로 imagePullSecret이 필요하다.
      # 토큰이 12시간마다 만료되므로 k8s/cluster/ecr-cred-refresh.yaml 이 8시간마다 갱신한다.
      imagePullSecrets:
        - name: ecr-cred
      containers:
        - name: place-service
          image: 189923011357.dkr.ecr.ap-northeast-2.amazonaws.com/moamap/place-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: moamap-config
            - secretRef:
                name: moamap-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
