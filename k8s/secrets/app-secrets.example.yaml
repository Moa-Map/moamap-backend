# 시크릿 템플릿. 이 파일을 app-secrets.yaml로 복사해 실제 값을 채운 뒤 apply 한다.
# 실제 값이 담긴 app-secrets.yaml은 gitignore 대상 — 절대 커밋 금지.
apiVersion: v1
kind: Secret
metadata:
  name: moamap-secrets
  namespace: moamap
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"          # user-service와 gateway가 같은 값이어야 함
  DB_USERNAME: "REPLACE_ME_DB_USERNAME"
  DB_PASSWORD: "REPLACE_ME_DB_PASSWORD"
  KAKAO_APP_ID: "REPLACE_ME_KAKAO_APP_ID"
  KAKAO_REST_API_KEY: "REPLACE_ME_KAKAO_REST_API_KEY"
  GEMINI_API_KEY: "REPLACE_ME_GEMINI_API_KEY"
  GEMINI_MODEL_ID: "REPLACE_ME_GEMINI_MODEL_ID"
  SEOUL_API_KEY: "REPLACE_ME_SEOUL_API_KEY"
  # 액세스 키는 없다 — 노드 IAM Role(인스턴스 프로파일)로 S3에 접근한다.
  OBJECT_STORAGE_REGION: "ap-northeast-2"
  OBJECT_STORAGE_BUCKET: "REPLACE_ME_OBJECT_STORAGE_BUCKET"
  OBJECT_STORAGE_PUBLIC_BASE_URL: "REPLACE_ME_OBJECT_STORAGE_PUBLIC_BASE_URL"
  RABBITMQ_USERNAME: "REPLACE_ME_RABBITMQ_USERNAME"
  RABBITMQ_PASSWORD: "REPLACE_ME_RABBITMQ_PASSWORD"
