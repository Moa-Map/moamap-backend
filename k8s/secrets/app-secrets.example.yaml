# 시크릿 템플릿. 이 파일을 app-secrets.yaml로 복사해 실제 값을 채운 뒤 apply 한다.
# 실제 값이 담긴 app-secrets.yaml은 gitignore 대상 — 절대 커밋 금지.
apiVersion: v1
kind: Secret
metadata:
  name: moamap-secrets
  namespace: moamap
type: Opaque
stringData:
  JWT_SECRET: "실제 시크릿"          # user-service와 gateway가 같은 값이어야 함
  DB_USERNAME: "실제 시크릿"
  DB_PASSWORD: "실제 시크릿"
  KAKAO_APP_ID: "실제 시크릿"
  KAKAO_REST_API_KEY: "실제 시크릿"
  GEMINI_API_KEY: "실제 시크릿"
  GEMINI_MODEL_ID: "실제 시크릿"
  SEOUL_API_KEY: "실제 시크릿"
