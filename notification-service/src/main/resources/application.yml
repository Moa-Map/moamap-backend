server:
  port: 8084

spring:
  application:
    name: notification-service

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # API별 p95를 재려면 버킷이 필요하다. Micrometer 기본값은 count/sum만 내보낸다.
      percentiles-histogram:
        http.server.requests: true
