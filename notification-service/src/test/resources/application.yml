# 테스트 전용 설정. src/test/resources가 클래스패스 우선순위상 main보다 앞이라
# 테스트 실행 시엔 이 파일이 main의 application.yml을 완전히 대체한다.
# H2 메모리 DB를 쓰므로 postgres 스키마(notification_service)가 필요 없다.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        # @SpringBootTest가 브로커 없이도 뜨도록 리스너 컨테이너 자동 기동을 끈다.
        auto-startup: false

services:
  user:
    base-url: http://localhost:1

notification:
  retention-days: 90
  # 테스트 중에는 정리 배치가 돌지 않게 한다(실행 시점에 따라 결과가 달라지는 테스트를 막는다).
  cleanup-cron: "-"
